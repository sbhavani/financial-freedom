services:
  php:
    build:
      context: .
      dockerfile: Dockerfile.php
      target: development
      args:
        USER_ID: ${SPIN_USER_ID}
        GROUP_ID: ${SPIN_GROUP_ID}
    ports:
      - "8443:8443"
      - "8080:8080"
    environment:
      SSL_MODE: "full"
    volumes:
      - .:/var/www/html/
    networks:
      - development

  node:
    build:
      context: .
      dockerfile: Dockerfile.node
      args:
        USER_ID: ${SPIN_USER_ID}
    networks:
      - development
    ports:
      - "5173:5173"
      - "3000:3000"
    environment:
      VITE_HOST: "0.0.0.0"
      VITE_HMR_HOST: "mac-mini-i7.local"
      VITE_HMR_PORT: "5173"
      VITE_PORT: "5173"
    volumes:
      - .:/usr/src/app/:cached
    working_dir: /usr/src/app/
    command: npm run dev

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - development

networks:
  development:
